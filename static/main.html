<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Frontend</title>
</head>
<body>
<h1>CRUD Operations</h1>

<h2>Add User</h2>
<input type="text" id="nickname" placeholder="Nickname">
<input type="text" id="password" placeholder="Password">
<button onclick="addUser()">Add User</button>

<h2>Get All Users</h2>
<button onclick="getUsers()">Get Users</button>
<ul id="userList">

</ul>
<ul id="singleusr">

</ul>

<h2>Update or Delete User</h2>
<input type="text" id="userId" placeholder="User ID">
<input type="text" id="newNickname" placeholder="New Nickname">
<input type="text" id="newPassword" placeholder="New Password">
<button onclick="updateUser()">Update User</button>
<button onclick="deleteUser()">Delete User</button>
<button onclick="findUser()">Find User</button>
<br>
<input type="text" id="filterInput" placeholder="Filter by Nickname">
<button onclick="filterUsers()">Filter User</button>

<!-- Link to External JavaScript -->
<script src="script.js"></script>
</body>
</html>
